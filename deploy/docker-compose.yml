# 首次运行：bash deploy/docker-install.sh；然后浏览器安装向导选择 MySQL。
# /app 内保存配置、上传、主题与 SQLite 引导库；MySQL 单独持久化。
services:
  zcard:
    image: zcard-local:${ZCARD_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${ZCARD_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${ZCARD_BIND:-0.0.0.0}:${ZCARD_PORT:-8000}:8000"
    environment:
      ZCARD_JWT_ADMIN_KEY: ${ZCARD_JWT_ADMIN_KEY:?请先运行 deploy/docker-install.sh}
      ZCARD_JWT_USER_KEY: ${ZCARD_JWT_USER_KEY:?请先运行 deploy/docker-install.sh}
      ZCARD_CARD_KEY: ${ZCARD_CARD_KEY:?请先运行 deploy/docker-install.sh}
      ZCARD_DATA_KEY: ${ZCARD_DATA_KEY:?请先运行 deploy/docker-install.sh}
    volumes:
      - app-data:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zcard
      MYSQL_USER: zcard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 deploy/docker-install.sh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 deploy/docker-install.sh}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u zcard zcard -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-data:
  mysql-data:
  redis-data:
