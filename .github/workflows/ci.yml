name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  open-source-guard:
    name: 开源红线（SaaS/商业版代码禁止进入 GitHub）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 分支名检查（local/* 与含 saas 的分支禁止出现在远端）
        if: ${{ startsWith(github.ref, 'refs/heads/local/') || contains(github.ref, 'saas') }}
        run: |
          echo "::error::SaaS 功能分支（${GITHUB_REF#refs/heads/}）禁止推送到 GitHub——SaaS 开发只存在于本地分支 local/saas*，见 doc/plan/P4/P4-00 §0 分支纪律"
          exit 1
      - name: 禁路径扫描（商业版目录与商业表 schema）
        run: |
          set -e
          # 禁路径：商业版代码目录 / SaaS 目录
          if git ls-files | grep -qE '(^|/)internal/commercial/|(^|/)saas/'; then
            echo "::error::检出商业版/SaaS 代码路径（internal/commercial/** 或 saas/**）——开源仓库禁止，见 doc/plan/P4/P4-00"
            exit 1
          fi
          # 禁文件：商业版 12 张表的 ent schema（《商业版数据模型.md》）
          if git ls-files 'server/internal/data/ent/schema/*' | grep -qE '(tenants|escrow|subscription|license|api_key|api_scope|installed_plugin|plugin_manifest|market_supplier|supplier_rating)s?\.go$'; then
            echo "::error::检出商业版数据表 schema（tenants/escrow/subscription/licenses/api_keys/插件市场等）——开源仓库禁止，见 doc/plan/P4/P4-00"
            exit 1
          fi
          echo "开源红线检查通过 ✓"
  server:
    name: server（生成物校验 + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 安装工具
        run: make init
      - name: 生成物无 diff 校验（离线可构建）
        run: |
          make generate
          git diff --exit-code -- . ':(exclude)go.sum' || (echo "::error::生成物与提交内容不一致，请运行 make generate 并提交"; exit 1)
      - name: Lint
        run: make lint
      - name: 架构守护测试 + 单元测试（SQLite 线）
        run: make test

  server-integration:
    name: server 集成（MySQL/PG 线，M1 起启用）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: zcard_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zcard_test
          POSTGRES_PASSWORD: pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: 集成测试（占位：M1 交付并发防超卖双路径用例）
        run: echo "M1 起启用：go test -tags=integration ./..."
