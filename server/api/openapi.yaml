            operationId: AdminCatalogService_DeleteTag
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /api/v1/storefront/config:
        get:
            tags:
                - StorefrontConfigService
            description: GetPublicConfig 前台公开配置（全部分组白名单键合并下发，稳定排序）。
            operationId: StorefrontConfigService_GetPublicConfig
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.storefront.v1.PublicConfig'
    /api/v1/storefront/currencies:
        get:
            tags:
                - StorefrontConfigService
            description: ListCurrencies 启用货币列表（展示换算用）。
            operationId: StorefrontConfigService_ListCurrencies
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.storefront.v1.Currencies'
    /api/v1/storefront/orders:
        post:
            tags:
                - StoreOrderService
            description: CreateOrder 下单（锁卡→算价→快照→事件；Idempotency-Key 头防重）。
            operationId: StoreOrderService_CreateOrder
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/zcard.api.storefront.v1.CreateOrderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.storefront.v1.CreateOrderReply'
    /api/v1/storefront/orders/{orderNo}:
        get:
            tags:
                - StoreOrderService
            description: GetOrder 凭单号+查询密码查单（三重门之一二）。
            operationId: StoreOrderService_GetOrder
            parameters:
                - name: orderNo
                  in: path
                  required: true
                  schema:
                    type: string
                - name: queryPassword
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.storefront.v1.GetOrderReply'
    /api/v1/storefront/products:
        get:
            tags:
                - StoreCatalogService
            description: ListProducts 商品列表（上架 + 按排序；库存数仅当 stock_visible 时返回）。
            operationId: StoreCatalogService_ListProducts
            parameters:
                - name: categoryId
                  in: query
                  description: 分类过滤（可选）
                  schema:
                    type: string
                - name: keyword
                  in: query
                  description: 搜索关键词（可选，仅商品名等值/前缀匹配；全文搜索 M3 走外置）
                  schema:
                    type: string
                - name: page.page
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: page.pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.storefront.v1.ListProductsReply'
    /api/v1/storefront/products/{id}:
        get:
            tags:
                - StoreCatalogService
            description: GetProduct 商品详情（下架/隐藏商品返回 NOT_FOUND）。
            operationId: StoreCatalogService_GetProduct
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.storefront.v1.Product'
    /api/v1/supply/ping:
        get:
            tags:
                - SupplyService
            description: Ping 连通性与协议版本探测（下游对接第一步）。
            operationId: SupplyService_Ping
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.supply.v1.PingReply'
