components:
    schemas:
        zcard.api.admin.v1.Admin:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                nickname:
                    type: string
                avatar:
                    type: string
                roleId:
                    type: string
                roleName:
                    type: string
                enabled:
                    type: boolean
                totpEnabled:
                    type: boolean
                remark:
                    type: string
            description: Admin 员工（不含密码哈希等敏感字段）。
        zcard.api.admin.v1.AdminProfile:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                nickname:
                    type: string
                avatar:
                    type: string
                roleId:
                    type: string
                roleName:
                    type: string
                totpEnabled:
                    type: boolean
                lastLoginAt:
                    type: string
                    format: date-time
                lastLoginIp:
                    type: string
        zcard.api.admin.v1.CreateAdminRequest:
            required:
                - username
                - password
                - roleId
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                nickname:
                    type: string
                roleId:
                    type: string
                remark:
                    type: string
        zcard.api.admin.v1.CreateCurrencyRequest:
            required:
                - code
                - symbol
                - rateJson
            type: object
            properties:
                code:
                    type: string
                symbol:
                    type: string
                position:
                    type: string
                precision:
                    type: integer
                    format: int32
                rateJson:
                    type: string
        zcard.api.admin.v1.CreateRoleRequest:
            required:
                - name
                - code
            type: object
            properties:
                name:
                    type: string
                code:
                    type: string
                description:
                    type: string
                permissions:
                    type: array
                    items:
                        type: string
        zcard.api.admin.v1.Currency:
            type: object
            properties:
                code:
                    type: string
                symbol:
                    type: string
                position:
                    type: string
                precision:
                    type: integer
                    format: int32
                rateJson:
                    type: string
                enabled:
                    type: boolean
                sort:
                    type: integer
                    format: int32
            description: Currency 货币（rate 为 decimal 字符串）。
        zcard.api.admin.v1.CurrencyList:
            type: object
            properties:
                currencies:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.admin.v1.Currency'
        zcard.api.admin.v1.GetProfileReply:
            type: object
            properties:
                admin:
                    $ref: '#/components/schemas/zcard.api.admin.v1.AdminProfile'
                permissions:
                    type: array
                    items:
                        type: string
                    description: 权限点清单（如 order:list / card:view_content），前端据此生成菜单与按钮
        zcard.api.admin.v1.Group:
            type: object
            properties:
                domain:
                    type: string
                label:
                    type: string
                perms:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.admin.v1.Perm'
            description: Group 域分组。
        zcard.api.admin.v1.ListAdminsReply:
            type: object
            properties:
                admins:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.admin.v1.Admin'
        zcard.api.admin.v1.ListRolesReply:
