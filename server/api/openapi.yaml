                        $ref: '#/components/schemas/zcard.api.storefront.v1.Product'
                page:
                    $ref: '#/components/schemas/zcard.api.common.v1.PageResp'
        zcard.api.storefront.v1.OrderItemInput:
            required:
                - productId
                - quantity
            type: object
            properties:
                productId:
                    type: string
                skuId:
                    type: string
                quantity:
                    type: integer
                    format: int32
        zcard.api.storefront.v1.OrderItemReply:
            type: object
            properties:
                productId:
                    type: string
                productName:
                    type: string
                quantity:
                    type: integer
                    format: int32
                unitPriceCents:
                    type: string
        zcard.api.storefront.v1.Product:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                description:
                    type: string
                cover:
                    type: string
                priceCents:
                    type: string
                    description: 售价（分，基础货币）
                stockType:
                    type: string
                    description: 库存类型 card/url/code
                stock:
                    type: string
                    description: 库存显示开关开启时为真实值，否则不下发（0）
                stockVisible:
                    type: boolean
                    description: 库存是否对外可见
                categoryId:
                    type: string
                salesCount:
                    type: string
                    description: 展示销量 = 真实 + 虚拟
            description: Product 顾客视角商品（管理字段与成本价绝不下发）。
        zcard.api.storefront.v1.PublicConfig:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.storefront.v1.PublicConfigEntry'
            description: PublicConfig 公开配置条目列表。
        zcard.api.storefront.v1.PublicConfigEntry:
            type: object
            properties:
                key:
                    type: string
                valueJson:
                    type: string
            description: PublicConfigEntry 单键（key 形如 "site.name"；value 为 JSON 文档字符串）。
        zcard.api.supply.v1.PingReply:
            type: object
            properties:
                protocol:
                    type: string
                version:
                    type: string
                serverTime:
                    type: string
tags:
    - name: AdminAuthService
      description: |-
        AdminAuthService 管理后台认证（admin realm JWT，双 realm 防提权串用）。
         里程碑 M0：登录 / 登出 / 当前身份（含权限点，供前端动态路由）。
    - name: AdminCatalogService
      description: AdminCatalogService 商品目录管理（P1-01）：商品/分类/标签/控件/商品组/评价。
    - name: AdminCurrencyService
      description: AdminCurrencyService 货币管理（P0-04 T3；多币种展示，记账永远基础货币）。
    - name: AdminInventoryService
      description: AdminInventoryService 卡密库存管理（P1-02）：导入/导出/列表/操作。
    - name: AdminOrderService
      description: AdminOrderService 订单管理（P1-03 T7）。
    - name: AdminSettingsService
      description: |-
        AdminSettingsService 设置中心（settings 表 = 运行时业务开关真理源，铁律 7）。
         里程碑 M0：读写 API；M1 起补齐安装向导状态与分组目录。
    - name: AdminUserService
      description: AdminUserService 员工管理（数据层归 identity，API 面在此；P0-03 T2）。
    - name: RoleService
      description: |-
        RoleService 角色与权限管理（自建 RBAC，规划 §5.14；P0-03）。
         权限目录由模块声明式生成（authz.Declare），本服务只读下发供前端勾选与动态路由。
    - name: StoreCatalogService
      description: |-
        StoreCatalogService 顾客前台商品目录（游客可访问；隐藏商品对游客 404，规划 §5.2）。
         里程碑 M1a；M0 骨架先打通「租户上下文 → Ent 查询 → 薄 service」链路。
    - name: StoreOrderService
      description: StoreOrderService 顾客下单（P1-03 T2）。
    - name: StorefrontConfigService
      description: |-
        StorefrontConfigService 前台公开配置（P0-04 T3）。
         输出经 PUBLIC_KEYS 白名单过滤（SECRET 键绝不外泄——快照测试守护）；
         storefront 前端模板参数、交易开关、启用语言/货币由此驱动。
    - name: SupplyService
      description: |-
        SupplyService 对外供货 API（本站作上游，ZCard Supply v2 协议）。
         里程碑 M2 完整落地：HMAC 四头鉴权（X-Supply-Key/Timestamp/Nonce/Signature）、
         ±300s 时间窗、Nonce 防重放、按 key 限流（规划 §5.8）。
         M0 骨架仅提供 Ping 连通性端点，鉴权中间件挂载点已预留在 server/http.go。
