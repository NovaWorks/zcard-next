tags:
    - name: AdminAuditService
      description: AdminAuditService 审计与风控管理（P2-06）：三类日志查询、黑名单管理。
    - name: AdminAuthService
      description: |-
        AdminAuthService 管理后台认证（admin realm JWT，双 realm 防提权串用）。
         里程碑 M0：登录 / 登出 / 当前身份（含权限点，供前端动态路由）。
    - name: AdminCatalogService
      description: AdminCatalogService 商品目录管理（P1-01）：商品/分类/标签/控件/商品组/评价。
    - name: AdminContentService
      description: |-
        AdminContentService 内容管理（P2-04）：横幅/文章/分类 CRUD。
         content_json 入库前经 sanitize（与商品描述同一策略）；slug 唯一。
    - name: AdminCouponService
      description: AdminCouponService 优惠券管理（P3-02 M1b 基础版：批量生成/列表/作废）。
    - name: AdminCurrencyService
      description: AdminCurrencyService 货币管理（P0-04 T3；多币种展示，记账永远基础货币）。
    - name: AdminDashboardService
      description: AdminDashboardService 工作台指标（P3-07 M1b v1）。
    - name: AdminFulfillmentService
      description: AdminFulfillmentService 履约管理（P1-06 T3）：待发货列表 + 手动交付。
    - name: AdminInventoryService
      description: AdminInventoryService 卡密库存管理（P1-02）：导入/导出/列表/操作。
    - name: AdminLicenseService
      description: |-
        AdminLicenseService 订阅许可证管理（M3，主文档 §11）：安装/查询/清除。
         校验引擎 ed25519 签名 + 实例 ID/域名绑定 + 到期（fail-closed）。
    - name: AdminMediaService
      description: |-
        AdminMediaService 素材库管理（P3-06）：分类/上传/列表/改名/移动/批量删除
         （ref_count>0 需 confirm）/外链导入/复制链接。
         上传走 base64（10MB 图 ~13.7MB JSON；管理面可接受，走统一中间件栈）。
    - name: AdminMemberLevelService
      description: AdminMemberLevelService 会员等级管理（P3-01）。
    - name: AdminNotifyService
      description: AdminNotifyService 通知管理（P2-05）：模板 CRUD/测试发送、发送日志查询/重发。
    - name: AdminOrderService
      description: AdminOrderService 订单管理（P1-03 T7）。
    - name: AdminPaymentService
      description: AdminPaymentService 支付管理（P1-04）：渠道 CRUD + 支付单 + 退款。
    - name: AdminProcurementService
      description: AdminProcurementService 采购管理（P2-02）：采购单列表/详情/手动重试/手动标记完成。
    - name: AdminResellerService
      description: |-
        AdminResellerService 分站管理（P3-04 主站面核心）：申请审核/列表/定价/账本/余额。
         域名验证与分站后台完整面随 storefront 用户登录体系接续（核心引擎已就绪）。
    - name: AdminSettingsService
      description: |-
        AdminSettingsService 设置中心（settings 表 = 运行时业务开关真理源，铁律 7）。
         里程碑 M0：读写 API；M1 起补齐安装向导状态与分组目录。
    - name: AdminSupplierService
      description: |-
        AdminSupplierService 对外供货管理（P2-03 T6）：下游账户申请/审核/启停/重置密钥、
         供货定价 CRUD、账本流水、回调记录查询与手动重发。
    - name: AdminSupplyService
      description: |-
        AdminSupplyService 货源连接管理（P2-01）：上游连接 CRUD + Ping 探活、
         商品映射规则、同步任务（创建/列表/详情/取消）、连接健康。
         凭据纪律：credentials 仅创建时明文传入，任何响应都不回显密文
         （列表/详情只给 credentials_set 布尔，铁律 11）。
    - name: AdminTicketService
      description: |-
        AdminTicketService 客服工单工作台（P3-05）：urgent_paid 置顶持续高亮、
         认领/回复/内部备注/解决/关闭、筛选。
    - name: AdminUserService
      description: AdminUserService 员工管理（数据层归 identity，API 面在此；P0-03 T2）。
    - name: AdminWalletService
      description: AdminWalletService 钱包管理（P1-05）：调账/充值单/流水查询。
    - name: RoleService
      description: |-
        RoleService 角色与权限管理（自建 RBAC，规划 §5.14；P0-03）。
         权限目录由模块声明式生成（authz.Declare），本服务只读下发供前端勾选与动态路由。
    - name: StoreAffiliateService
      description: StoreAffiliateService 我的分销（P3-03）：推广码/团队/佣金流水/统计。
    - name: StoreCartService
      description: |-
        StoreCartService 购物车（P1-03b T5 销账）：登录态专属 CRUD；
         结算复用 StoreOrderService.CreateOrder（多商品一单支付，零下单改动）。
    - name: StoreCatalogService
      description: |-
        StoreCatalogService 顾客前台商品目录（游客可访问；隐藏商品对游客 404，规划 §5.2）。
         里程碑 M1a；M0 骨架先打通「租户上下文 → Ent 查询 → 薄 service」链路。
    - name: StoreContentService
      description: |-
        StoreContentService 前台内容（P2-04）：横幅（生效时间窗）、文章（公告/博客）、分类。
         多语言字段按请求语言回落（zh_CN 默认）。
    - name: StoreCouponService
      description: StoreCouponService 前台营销（P3-02）：我的券/兑换码领券/秒杀营销位。
    - name: StoreDeliveryService
      description: StoreDeliveryService 顾客取货（P1-06 T2 三重门：单号+密码+限流）。
    - name: StoreLicenseService
      description: |-
        StoreLicenseService 专业套餐在线购买（P3-08 M3：发行侧部署配置签发私钥后开放；
         支付 = 钱包余额扣款（充值管线入账的钱），签发与扣款同事务；购买人下载许可证
         文件后在目标实例后台安装激活）。
    - name: StoreMemberLevelService
      description: StoreMemberLevelService 会员等级（P3-01 M3：等级进度 + 积分产生）。
    - name: StoreNotificationService
      description: StoreNotificationService 站内信铃铛（P2-05 T3）：未读数/列表/已读。
    - name: StoreOrderService
      description: StoreOrderService 顾客下单（P1-03 T2）。
    - name: StorePaymentService
      description: StorePaymentService 顾客支付（P1-04 T2）。
    - name: StoreTicketService
      description: |-
        StoreTicketService 用户工单（P3-05）：创建/列表/详情/回复/评价/付费加急。
         游客可创建（guest_contact 必填）；内部备注用户侧自动过滤。
    - name: StoreUserService
      description: |-
        StoreUserService 用户中心（P3-04 前置）：注册/登录（user realm JWT）/我的信息。
         注册可带邀请码（ref=<user_id>）——三级分销归因链写入（环状拒绝）。
    - name: StoreWalletService
      description: StoreWalletService 顾客钱包（P1-05）：余额/积分/流水/充值。
    - name: StorefrontConfigService
      description: |-
        StorefrontConfigService 前台公开配置（P0-04 T3）。
         输出经 PUBLIC_KEYS 白名单过滤（SECRET 键绝不外泄——快照测试守护）；
         storefront 前端模板参数、交易开关、启用语言/货币由此驱动。
    - name: SupplyService
      description: |-
        SupplyService 对外供货 API（本站作上游，ZCard Supply v2 协议）。
         里程碑 M2 完整落地：HMAC 四头鉴权（X-Supply-Key/Timestamp/Nonce/Signature）、
         ±300s 时间窗、Nonce 防重放、按 key 限流（规划 §5.8）。
         Ping 免签名（连通性探测）；其余端点全部需要签名。
         金额口径：一律「分」（int64）——与 P2-01 zcard 适配器对偶。
