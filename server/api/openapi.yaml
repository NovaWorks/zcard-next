                expiresAt:
                    type: string
                    description: 过期时间（unix 秒）
                admin:
                    $ref: '#/components/schemas/zcard.api.admin.v1.AdminProfile'
        zcard.api.admin.v1.LoginRequest:
            required:
                - username
                - password
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                totpCode:
                    type: string
                    description: TOTP 六位动态码（员工开启二步验证时必填）
        zcard.api.admin.v1.Perm:
            type: object
            properties:
                code:
                    type: string
                desc:
                    type: string
                adminOnly:
                    type: boolean
                public:
                    type: boolean
            description: Perm 权限点。
        zcard.api.admin.v1.PermissionTree:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.admin.v1.Group'
            description: PermissionTree 权限目录树。
        zcard.api.admin.v1.Role:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                code:
                    type: string
                description:
                    type: string
                isBuiltin:
                    type: boolean
                permissions:
                    type: array
                    items:
                        type: string
            description: Role 角色详情。
        zcard.api.admin.v1.Setting:
            type: object
            properties:
                group:
                    type: string
                key:
                    type: string
                valueJson:
                    type: string
            description: Setting 设置项（value_json 为 JSON 文档字符串）。
        zcard.api.admin.v1.ToggleAdminRequest:
            required:
                - id
                - enabled
            type: object
            properties:
                id:
                    type: string
                enabled:
                    type: boolean
        zcard.api.admin.v1.UpdateAdminRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                nickname:
                    type: string
                avatar:
                    type: string
                roleId:
                    type: string
                remark:
                    type: string
        zcard.api.admin.v1.UpdateCurrencyRequest:
            required:
                - code
            type: object
            properties:
                code:
                    type: string
                symbol:
                    type: string
                position:
                    type: string
                precision:
                    type: integer
                    format: int32
                rateJson:
                    type: string
                enabled:
                    type: boolean
                sort:
                    type: integer
                    format: int32
        zcard.api.admin.v1.UpdateRolePermissionsRequest:
            required:
                - id
                - permissions
            type: object
            properties:
                id:
                    type: string
                permissions:
                    type: array
                    items:
                        type: string
        zcard.api.admin.v1.UpdateRoleRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
        zcard.api.admin.v1.UpdateSettingRequest:
            required:
                - group
                - key
                - valueJson
            type: object
            properties:
                group:
                    type: string
                key:
                    type: string
                valueJson:
                    type: string
                    description: 任意 JSON 文档（对象/数组/标量均可），服务端原样存储
        zcard.api.common.v1.PageResp:
            type: object
            properties:
                total:
                    type: string
                page:
                    type: integer
                    format: int32
                pageSize:
                    type: integer
                    format: int32
            description: PageResp 分页响应。
        zcard.api.storefront.v1.Currencies:
            type: object
            properties:
                currencies:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.storefront.v1.Currency'
            description: Currencies 货币列表。
        zcard.api.storefront.v1.Currency:
            type: object
            properties:
                code:
                    type: string
                symbol:
                    type: string
                position:
                    type: string
                precision:
                    type: integer
                    format: int32
                rateJson:
                    type: string
            description: Currency 货币（rate 为 decimal 字符串——前端 decimal 换算，杜绝浮点误差入口）。
        zcard.api.storefront.v1.ListProductsReply:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.storefront.v1.Product'
                page:
                    $ref: '#/components/schemas/zcard.api.common.v1.PageResp'
        zcard.api.storefront.v1.Product:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                description:
                    type: string
                cover:
                    type: string
                priceCents:
                    type: string
                    description: 售价（分，基础货币）
                stockType:
                    type: string
                    description: 库存类型 card/url/code
                stock:
                    type: string
                    description: 库存显示开关开启时为真实值，否则不下发（0）
                stockVisible:
                    type: boolean
                    description: 库存是否对外可见
                categoryId:
                    type: string
                salesCount:
                    type: string
