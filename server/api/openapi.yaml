components:
    schemas:
        zcard.api.admin.v1.AddSiteRequest:
            required:
                - domain
            type: object
            properties:
                domain:
                    type: string
                siteName:
                    type: string
                isPrimary:
                    type: boolean
        zcard.api.admin.v1.AdjustRequest:
            required:
                - userId
                - amountCents
                - reason
            type: object
            properties:
                userId:
                    type: string
                amountCents:
                    type: string
                reason:
                    type: string
        zcard.api.admin.v1.Admin:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                nickname:
                    type: string
                avatar:
                    type: string
                roleId:
                    type: string
                roleName:
                    type: string
                enabled:
                    type: boolean
                totpEnabled:
                    type: boolean
                remark:
                    type: string
            description: Admin 员工（不含密码哈希等敏感字段）。
        zcard.api.admin.v1.AdminCommission:
            type: object
            properties:
                id:
                    type: string
                orderId:
                    type: string
                buyerId:
                    type: string
                referrerId:
                    type: string
                tier:
                    type: integer
                    format: int32
                rate:
                    type: number
                    format: double
                baseAmount:
                    type: string
                amount:
                    type: string
                status:
                    type: string
                availableAt:
                    type: string
                createdAt:
                    type: string
        zcard.api.admin.v1.AdminControl:
            type: object
            properties:
                id:
                    type: string
                productId:
                    type: string
                name:
                    type: string
                type:
                    type: string
                required:
                    type: boolean
                options:
                    type: array
                    items:
                        type: string
                sort:
                    type: integer
                    format: int32
        zcard.api.admin.v1.AdminOrder:
            type: object
            properties:
                id:
                    type: string
