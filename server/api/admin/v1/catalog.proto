syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminCatalogService 商品目录管理（P1-01）：商品/分类/标签/控件/商品组/评价。
service AdminCatalogService {
  // ── 商品 ──
  rpc ListProducts(ListProductsRequest) returns (ListProductsReply) {
    option (google.api.http) = { get: "/api/v1/admin/products" };
  }
  rpc GetProduct(GetProductRequest) returns (AdminProduct) {
    option (google.api.http) = { get: "/api/v1/admin/products/{id}" };
  }
  rpc CreateProduct(CreateProductRequest) returns (AdminProduct) {
    option (google.api.http) = { post: "/api/v1/admin/products" body: "*" };
  }
  rpc UpdateProduct(UpdateProductRequest) returns (AdminProduct) {
    option (google.api.http) = { put: "/api/v1/admin/products/{id}" body: "*" };
  }
  rpc DeleteProduct(DeleteProductRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/products/{id}" };
  }

  // ── 分类 ──
  rpc ListCategories(google.protobuf.Empty) returns (CategoryList) {
    option (google.api.http) = { get: "/api/v1/admin/categories" };
  }
  rpc CreateCategory(CreateCategoryRequest) returns (Category) {
    option (google.api.http) = { post: "/api/v1/admin/categories" body: "*" };
  }
  rpc UpdateCategory(UpdateCategoryRequest) returns (Category) {
    option (google.api.http) = { put: "/api/v1/admin/categories/{id}" body: "*" };
  }
  rpc DeleteCategory(DeleteCategoryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/categories/{id}" };
  }

  // ── 标签 ──
  rpc ListTags(google.protobuf.Empty) returns (TagList) {
    option (google.api.http) = { get: "/api/v1/admin/tags" };
  }
  rpc CreateTag(CreateTagRequest) returns (Tag) {
    option (google.api.http) = { post: "/api/v1/admin/tags" body: "*" };
  }
  rpc DeleteTag(DeleteTagRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/tags/{id}" };
  }

  // ── 自定义控件 ──
  rpc ListControls(ListControlsRequest) returns (ControlList) {
    option (google.api.http) = { get: "/api/v1/admin/products/{product_id}/controls" };
  }
  rpc CreateControl(CreateControlRequest) returns (AdminControl) {
    option (google.api.http) = { post: "/api/v1/admin/products/{product_id}/controls" body: "*" };
  }
  rpc UpdateControl(UpdateControlRequest) returns (AdminControl) {
    option (google.api.http) = { put: "/api/v1/admin/controls/{id}" body: "*" };
  }
  rpc DeleteControl(DeleteControlRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/controls/{id}" };
  }

  // ── 评价（真实一单一评审核 + 虚拟评价）──
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsReply) {
    option (google.api.http) = { get: "/api/v1/admin/reviews" };
  }
  rpc ApproveReview(ApproveReviewRequest) returns (ReviewItem) {
    option (google.api.http) = { post: "/api/v1/admin/reviews/{id}/approve" body: "*" };
  }
  rpc RejectReview(RejectReviewRequest) returns (ReviewItem) {
    option (google.api.http) = { post: "/api/v1/admin/reviews/{id}/reject" body: "*" };
  }
  rpc CreateVirtualReview(CreateVirtualReviewRequest) returns (VirtualReviewItem) {
    option (google.api.http) = { post: "/api/v1/admin/virtual-reviews" body: "*" };
  }

  // ── SKU 多规格 ──
  rpc ListSkus(ListSkusRequest) returns (SkuList) {
    option (google.api.http) = { get: "/api/v1/admin/products/{product_id}/skus" };
  }
  rpc CreateSku(CreateSkuRequest) returns (Sku) {
    option (google.api.http) = { post: "/api/v1/admin/products/{product_id}/skus" body: "*" };
  }
  rpc UpdateSku(UpdateSkuRequest) returns (Sku) {
    option (google.api.http) = { put: "/api/v1/admin/skus/{id}" body: "*" };
  }
  rpc DeleteSku(DeleteSkuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/skus/{id}" };
  }

  // ── 会员商品组 ──
  rpc ListMemberGroups(google.protobuf.Empty) returns (MemberGroupList) {
    option (google.api.http) = { get: "/api/v1/admin/member-groups" };
  }
  rpc CreateMemberGroup(CreateMemberGroupRequest) returns (MemberGroup) {
    option (google.api.http) = { post: "/api/v1/admin/member-groups" body: "*" };
  }
  rpc UpdateMemberGroup(UpdateMemberGroupRequest) returns (MemberGroup) {
    option (google.api.http) = { put: "/api/v1/admin/member-groups/{id}" body: "*" };
  }
  rpc DeleteMemberGroup(DeleteMemberGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/member-groups/{id}" };
  }
}

// ── 商品消息 ──

message ListProductsRequest {
  uint64 category_id = 1;
  string keyword = 2;
  int32 status = 3; // 0=全部 1=上架 0=下架 2=隐藏
  int32 page = 4;
  int32 page_size = 5;
}

message ListProductsReply {
  repeated AdminProduct products = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetProductRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// AdminProduct 管理面商品（含成本价等敏感字段）。
message AdminProduct {
  uint64 id = 1;
  uint64 category_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;   // sanitize 后
  string cover = 6;
  repeated string images = 7;
  int64 price_cents = 8;
  int64 factory_price_cents = 9;
  string stock_type = 10;    // card | url | code
  bool stock_visible = 11;
  string delivery_mode = 12; // status | delete
  bool dedup = 13;
  int32 sort = 14;
  int32 status = 15;         // 1=上架 0=下架 2=隐藏
  int64 stock = 16;           // 计算字段（available 数）
  uint64 upstream_source_id = 17;
  string upstream_product_code = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
}

message CreateProductRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 category_id = 2;
  string description = 3;
  string cover = 4;
  repeated string images = 5;
  int64 price_cents = 6 [(google.api.field_behavior) = REQUIRED];
  int64 factory_price_cents = 7;
  string stock_type = 8 [(google.api.field_behavior) = REQUIRED];
  string delivery_mode = 9;
  bool stock_visible = 10;
  bool dedup = 11;
  int32 sort = 12;
  int32 status = 13;
}

message UpdateProductRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  uint64 category_id = 3;
  string description = 4;
  string cover = 5;
  repeated string images = 6;
  int64 price_cents = 7;
  int64 factory_price_cents = 8;
  string delivery_mode = 9;
  bool stock_visible = 10;
  int32 sort = 11;
  int32 status = 12;
}

message DeleteProductRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ── 分类消息 ──

message CategoryList {
  repeated Category categories = 1;
}

// Category 分类（树形，含子分类计数）。
message Category {
  uint64 id = 1;
  uint64 parent_id = 2;
  string name = 3;
  string icon = 4;
  bool hide = 5;
  int32 sort = 6;
  int64 product_count = 7;
  repeated Category children = 8;
}

message CreateCategoryRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 parent_id = 2;
  string icon = 3;
  int32 sort = 4;
}

message UpdateCategoryRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  string icon = 3;
  bool hide = 4;
  int32 sort = 5;
}

message DeleteCategoryRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ── 标签消息 ──

message TagList {
  repeated Tag tags = 1;
}

message Tag {
  uint64 id = 1;
  string name = 2;
  string slug = 3;
  string icon = 4;
  string color = 5;
  string position = 6;
  bool hide = 7;
}

message CreateTagRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string slug = 2 [(google.api.field_behavior) = REQUIRED];
  string icon = 3;
  string color = 4;
  string position = 5;
}

message DeleteTagRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ── 自定义控件消息 ──

message ListControlsRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ControlList {
  repeated AdminControl controls = 1;
}

message AdminControl {
  uint64 id = 1;
  uint64 product_id = 2;
  string name = 3;
  string type = 4;    // text | password | select | number | checkbox | radio
  bool required = 5;
  repeated string options = 6;
  int32 sort = 7;
}

message CreateControlRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string type = 3 [(google.api.field_behavior) = REQUIRED];
  bool required = 4;
  repeated string options = 5;
  int32 sort = 6;
}

message UpdateControlRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  string type = 3;
  bool required = 4;
  repeated string options = 5;
  int32 sort = 6;
}

message DeleteControlRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ── 评价消息 ──

message ListReviewsRequest {
  string status = 1; // pending | approved | rejected；空=全部
  int32 page = 2;
  int32 page_size = 3;
}

message ListReviewsReply {
  repeated ReviewItem reviews = 1;
  int64 total = 2;
}

// ReviewItem 真实评价（审核流：pending→approved/rejected）。
message ReviewItem {
  uint64 id = 1;
  uint64 product_id = 2;
  uint64 user_id = 3;
  uint64 order_id = 4;
  int32 rating = 5; // 1-5
  string content = 6;
  string status = 7;
  int64 created_at = 8;
}

message ApproveReviewRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RejectReviewRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// VirtualReviewItem 虚拟评价（与真实 approved 合并展示）。
message VirtualReviewItem {
  uint64 id = 1;
  uint64 product_id = 2;
  string nickname = 3;
  string content = 4;
  int32 rating = 5;
  int32 sort = 6;
  int64 created_at = 7;
}

message CreateVirtualReviewRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  string nickname = 2;
  string content = 3 [(google.api.field_behavior) = REQUIRED];
  int32 rating = 4;
  int32 sort = 5;
}

// ── SKU 消息 ──

message ListSkusRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message SkuList {
  repeated Sku skus = 1;
}

// Sku 管理面多规格（含成本价）。
message Sku {
  uint64 id = 1;
  uint64 product_id = 2;
  string name = 3;
  map<string, string> spec_values = 4;
  int64 price_cents = 5; // 独立售价（分；0=继承商品价）
  int64 cost_cents = 6;
  int32 stock_offset = 7;
  string upstream_sku_id = 8;
}

message CreateSkuRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  map<string, string> spec_values = 3;
  int64 price_cents = 4;
  int64 cost_cents = 5;
  int32 stock_offset = 6;
  string upstream_sku_id = 7;
}

message UpdateSkuRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  map<string, string> spec_values = 3;
  int64 price_cents = 4;
  int64 cost_cents = 5;
  int32 stock_offset = 6;
  string upstream_sku_id = 7;
}

message DeleteSkuRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ── 会员商品组消息 ──

message MemberGroupList {
  repeated MemberGroup groups = 1;
}

// MemberGroup 会员商品组（命中商品的订单按 discount 万分比打折）。
message MemberGroup {
  uint64 id = 1;
  string name = 2;
  repeated uint64 product_ids = 3;
  int32 discount = 4; // 万分比（9500=95 折）
  bool stack_member = 5;
  bool stack_coupon = 6;
  string badge_style = 7;
}

message CreateMemberGroupRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  repeated uint64 product_ids = 2;
  int32 discount = 3 [(google.api.field_behavior) = REQUIRED]; // 万分比
  bool stack_member = 4;
  bool stack_coupon = 5;
  string badge_style = 6;
}

message UpdateMemberGroupRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  repeated uint64 product_ids = 3;
  int32 discount = 4;
  bool stack_member = 5;
  bool stack_coupon = 6;
  string badge_style = 7;
}

message DeleteMemberGroupRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}
