syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminDashboardService 工作台指标（P3-07 M1b v1）。
service AdminDashboardService {
  // GetReconciliation 对账总览。
  rpc GetReconciliation(GetReconciliationRequest) returns (GetReconciliationReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/reconciliation" };
  }
  // ListCommissions 佣金列表（P3-03 affiliate）。
  rpc ListCommissions(ListCommissionsRequest) returns (ListCommissionsReply) {
    option (google.api.http) = { get: "/api/v1/admin/affiliate/commissions" };
  }
  rpc GetDashboard(google.protobuf.Empty) returns (DashboardReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard" };
  }
  // GetDailyStats 历史日结查询（只扫 daily_stats；分站视角自动隔离）。
  rpc GetDailyStats(GetDailyStatsRequest) returns (GetDailyStatsReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/daily-stats" };
  }
  // CreateReconciliationJob 创建货源对账任务（时间窗 ≤31 天）。
  rpc CreateReconciliationJob(CreateReconciliationJobRequest) returns (ReconciliationJobItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/dashboard/reconciliation-jobs"
      body: "*"
    };
  }
  // GetReconciliationJob 对账任务详情（四态计数 + 状态可查）。
  rpc GetReconciliationJob(GetReconciliationJobRequest) returns (ReconciliationJobItem) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/reconciliation-jobs/{id}" };
  }
  // RunReconciliationJob 执行任务（pending → processing → done/failed）。
  rpc RunReconciliationJob(RunReconciliationJobRequest) returns (ReconciliationJobItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/dashboard/reconciliation-jobs/{id}/run"
      body: "*"
    };
  }
  // ListReconciliationItems 对账明细分页（四态筛选）。
  rpc ListReconciliationItems(ListReconciliationItemsRequest) returns (ListReconciliationItemsReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/reconciliation-jobs/{id}/items" };
  }
}

message GetDailyStatsRequest {
  string start_date = 1; // yyyymmdd（空 = 近 7 天）
  string end_date = 2;
}

message DailyStatPoint {
  string date = 1;
  int64 orders = 2;
  int64 amount_cents = 3;
  int64 paid_orders = 4;
}

message GetDailyStatsReply {
  repeated DailyStatPoint points = 1;
}

message DashboardStat {
  int64 orders = 1;
  int64 revenue = 2;      // 分
  int64 paid_orders = 3;
}

message DashboardTrendPoint {
  string date = 1;
  int64 orders = 2;
  int64 revenue = 3;      // 分
}

message DashboardTopProduct {
  uint64 product_id = 1;
  string name = 2;
  int64 sold_qty = 3;
  int64 revenue = 4;      // 分
}

message DashboardReply {
  DashboardStat today = 1;
  DashboardStat last7d = 2;
  DashboardStat last30d = 3;
  repeated DashboardTrendPoint trend = 4;
  repeated DashboardTopProduct top_products = 5;
}

// ListCommissions 佣金管理列表（P3-03）。
message ListCommissionsRequest {
  string status = 1; // pending_confirm | available | withdrawn | reversed；空=全部
  int32 page = 2;
  int32 page_size = 3;
}

message AdminCommission {
  uint64 id = 1;
  uint64 order_id = 2;
  uint64 buyer_id = 3;
  uint64 referrer_id = 4;
  int32 tier = 5;
  double rate = 6;
  int64 base_amount = 7;
  int64 amount = 8;
  string status = 9;
  int64 available_at = 10;
  int64 created_at = 11;
}

message ListCommissionsReply {
  repeated AdminCommission commissions = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// GetReconciliation 对账总览（P3-07：订单×支付×佣金三向核对基础报表）。
message GetReconciliationRequest {
  string date = 1; // yyyymmdd；空 = 最新
}

message ReconciliationSummary {
  string date = 1;
  int64 order_paid_total = 2;     // 当日已支付订单额（分）
  int64 payment_success_total = 3; // 当日支付单成功额（分）
  int64 wallet_recharge_total = 4; // 当日钱包充值（分）
  int64 commission_total = 5;      // 当日佣金计提（分）
  int64 order_count = 6;
  int64 mismatch_count = 7;        // 订单/支付额差异数（>0 需人工）
}

message GetReconciliationReply {
  ReconciliationSummary summary = 1;
}

message CreateReconciliationJobRequest {
  uint64 connection_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 start = 2 [(google.api.field_behavior) = REQUIRED]; // unix 秒
  int64 end = 3 [(google.api.field_behavior) = REQUIRED];   // unix 秒
}

message ReconciliationJobItem {
  uint64 id = 1;
  uint64 connection_id = 2;
  string status = 3; // pending | processing | done | failed
  int64 time_range_start = 4;
  int64 time_range_end = 5;
  int32 total_count = 6;
  int32 matched_count = 7;
  int32 mismatched_count = 8;
  string result_json = 9;
  int64 created_at = 10;
}

message GetReconciliationJobRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RunReconciliationJobRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListReconciliationItemsRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2; // matched | mismatched | local_only | upstream_only
  int32 page = 3;
  int32 page_size = 4;
}

message ReconciliationItemDetail {
  uint64 id = 1;
  string status = 2;
  uint64 procurement_order_id = 3;
  string local_order_no = 4;
  string upstream_order_no = 5;
  string diff_json = 6;
  int64 created_at = 7;
}

message ListReconciliationItemsReply {
  repeated ReconciliationItemDetail items = 1;
  int64 total = 2;
}
