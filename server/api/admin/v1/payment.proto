syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminPaymentService 支付管理（P1-04）：渠道 CRUD + 支付单 + 退款。
service AdminPaymentService {
  // ── 渠道管理 ──
  rpc ListChannels(google.protobuf.Empty) returns (ChannelList) {
    option (google.api.http) = { get: "/api/v1/admin/payment/channels" };
  }
  // ListDrivers 驱动元数据（含配置字段 schema——admin 配置面动态表单渲染）。
  rpc ListDrivers(google.protobuf.Empty) returns (DriverList) {
    option (google.api.http) = { get: "/api/v1/admin/payment/drivers" };
  }
  // FieldOptions 驱动字段选项动态加载（epusdt network/token 以网关 supported_assets
  // 为准；网关不可达时后端回落静态矩阵并标记 fallback）。
  rpc FieldOptions(FieldOptionsRequest) returns (FieldOptionsReply) {
    option (google.api.http) = { get: "/api/v1/admin/payment/drivers/{code}/field-options" };
  }
  rpc CreateChannel(CreateChannelRequest) returns (Channel) {
    option (google.api.http) = { post: "/api/v1/admin/payment/channels" body: "*" };
  }
  rpc UpdateChannel(UpdateChannelRequest) returns (Channel) {
    option (google.api.http) = { put: "/api/v1/admin/payment/channels/{id}" body: "*" };
  }
  rpc DeleteChannel(DeleteChannelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/payment/channels/{id}" };
  }

  // ── 支付单 ──
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsReply) {
    option (google.api.http) = { get: "/api/v1/admin/payments" };
  }
  rpc GetPayment(GetPaymentRequest) returns (Payment) {
    option (google.api.http) = { get: "/api/v1/admin/payments/{id}" };
  }
  // CapturePayment 补单（主动拉网关状态复走回调管线）。
  rpc CapturePayment(CapturePaymentRequest) returns (Payment) {
    option (google.api.http) = { post: "/api/v1/admin/payments/{id}/capture" body: "*" };
  }

  // ── 退款 ──
  rpc CreateRefund(CreateRefundRequest) returns (RefundOrder) {
    option (google.api.http) = { post: "/api/v1/admin/refunds" body: "*" };
  }
  rpc ListRefunds(ListRefundsRequest) returns (ListRefundsReply) {
    option (google.api.http) = { get: "/api/v1/admin/refunds" };
  }
}

message ChannelList {
  repeated Channel channels = 1;
}

// Channel 渠道（config 为 AES-GCM 加密凭据，列表返回 ****）。
message Channel {
  uint64 id = 1;
  string name = 2;
  string code = 3;
  string driver = 4;
  string config_json = 5; // 脱敏后
  int64 fee = 6;
  string fee_type = 7;
  bool enabled = 8;
  int32 sort = 9;
  repeated string configured_fields = 10; // 已配置字段名（仅名不显值——脱敏）
  string callback_url = 11; // 回调地址（站点 URL 拼接；未配置站点时为相对路径）
}

// DriverList 驱动元数据列表。
message DriverList {
  repeated Driver drivers = 1;
}

// Driver 渠道驱动元数据（ListDrivers）。
message Driver {
  string code = 1;         // 驱动码（= adapter Type）
  string name = 2;         // 显示名
  string icon = 3;         // 品牌图标标识（前端图标库映射）
  string description = 4;  // 说明（适用场景/收款币种）
  repeated ConfigField fields = 5; // 配置字段 schema
}

// ConfigField 配置字段 schema（前端按 type 动态渲染表单）。
message ConfigField {
  string key = 1;
  string label = 2;
  string type = 3; // text | password | textarea | select | number | switch
  bool required = 4;
  string placeholder = 5;
  string help = 6;    // 字段帮助文案
  bool sensitive = 7; // 敏感字段：编辑时留空=保持原值，不回显
  bool dynamic = 8; // 选项动态加载（FieldOptions；失败回落 options）
  bool multiple = 9; // 多选（保存为数组；epusdt token/network——占位订单模式）
  repeated Option options = 10;
  string default = 11;
}

message Option {
  string label = 1;
  string value = 2;
}

message FieldOptionsRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED]; // 驱动码
  string field = 2 [(google.api.field_behavior) = REQUIRED]; // 字段 key（network/token）
  string config_json = 3; // 部分配置（仅非敏感字段，如 api_url）
}

message FieldOptionsReply {
  repeated Option options = 1;
  bool fallback = 2; // true=上游不可达回落静态矩阵（前端提示）
}

message CreateChannelRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  string driver = 3 [(google.api.field_behavior) = REQUIRED];
  string config_json = 4 [(google.api.field_behavior) = REQUIRED]; // 凭据 JSON 明文（入库前加密）
  int64 fee = 5;
  string fee_type = 6;
  bool enabled = 7;
  int32 sort = 8;
}

message UpdateChannelRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  string config_json = 3; // **** = 未修改
  int64 fee = 4;
  string fee_type = 5; // percent | fixed；空=不修改
  bool enabled = 6;
  int32 sort = 7;
}

message DeleteChannelRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListPaymentsRequest {
  string status = 1;
  string order_no = 2;
  uint64 cursor = 3;
  int32 limit = 4;
}

message ListPaymentsReply {
  repeated Payment payments = 1;
  uint64 next_cursor = 2;
}

message GetPaymentRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CapturePaymentRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Payment 支付单。
message Payment {
  uint64 id = 1;
  uint64 order_id = 2;
  string order_no = 3;
  string channel = 4;
  string channel_order_no = 5;
  int64 amount_cents = 6;
  int64 charged_cents = 7;
  int64 fee_cents = 8;
  string status = 9;
  int64 paid_at = 10;
  int64 created_at = 11;
}

message CreateRefundRequest {
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  int64 amount_cents = 2 [(google.api.field_behavior) = REQUIRED];
  string channel = 3 [(google.api.field_behavior) = REQUIRED]; // wallet | gateway | upstream
  string reason = 4;
}

message ListRefundsRequest {
  string status = 1;
}

message ListRefundsReply {
  repeated RefundOrder refunds = 1;
}

// RefundOrder 退款单。
message RefundOrder {
  uint64 id = 1;
  uint64 order_id = 2;
  string order_no = 3;
  int64 amount_cents = 4;
  string channel = 5;
  string status = 6;
  string reason = 7;
  string upstream_refund_id = 8;
  int64 created_at = 9;
}
