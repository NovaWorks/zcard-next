syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminCouponService 优惠券管理(基础版：批量生成/列表/作废）。
service AdminCouponService {
  // GrantCoupon 批次赠送指定用户。
  rpc GrantCoupon(GrantCouponRequest) returns (GrantCouponReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/coupons/grant"
      body: "*"
    };
  }
  // CreateFlashSale 创建秒杀。
  rpc CreateFlashSale(CreateFlashSaleRequest) returns (FlashSaleItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/flash-sales"
      body: "*"
    };
  }
  // ListFlashSales 秒杀列表。
  rpc ListFlashSales(ListFlashSalesRequest) returns (ListFlashSalesReply) {
    option (google.api.http) = { get: "/api/v1/admin/flash-sales" };
  }
  // DeleteFlashSale 删除秒杀。
  rpc DeleteFlashSale(DeleteFlashSaleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/admin/flash-sales/{id}"
    };
  }
  // UpsertPromotion 创建/更新促销。
  rpc UpsertPromotion(UpsertPromotionRequest) returns (PromotionItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/promotions"
      body: "*"
    };
  }
  // ListPromotions 促销列表。
  rpc ListPromotions(ListPromotionsRequest) returns (ListPromotionsReply) {
    option (google.api.http) = { get: "/api/v1/admin/promotions" };
  }
  rpc ListCoupons(ListCouponsRequest) returns (CouponList) {
    option (google.api.http) = { get: "/api/v1/admin/coupons" };
  }
  rpc CreateCouponBatch(CreateCouponBatchRequest) returns (CreateCouponBatchReply) {
    option (google.api.http) = { post: "/api/v1/admin/coupons/batch" body: "*" };
  }
  rpc DisableCoupon(DisableCouponRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/admin/coupons/disable" body: "*" };
  }
  // DeleteCoupons 批量删除券（仅未使用；可按 id 列表或整批未使用）。
  rpc DeleteCoupons(DeleteCouponsRequest) returns (DeleteCouponsReply) {
    option (google.api.http) = { post: "/api/v1/admin/coupons/delete" body: "*" };
  }
  // ExportCoupons 导出券码 CSV（按状态/批次，含表头）。
  rpc ExportCoupons(ExportCouponsRequest) returns (ExportCouponsReply) {
    option (google.api.http) = { get: "/api/v1/admin/coupons/export" };
  }
}

message Coupon {
  uint64 id = 1;
  string batch_id = 2;
  string name = 3;
  string type = 4; // fixed | percent
  int64 value = 5; // fixed=分；percent=万分比
  string code = 6;
  string status = 7; // unused | used | disabled
}

message CouponList {
  repeated Coupon coupons = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  repeated string batches = 5; // 去重批次列表（筛选下拉用）
}

message ListCouponsRequest {
  string status = 1;
  string batch_id = 2; // 按批次筛选
  int32 page = 3;
  int32 page_size = 4;
}

message CreateCouponBatchRequest {
  string name = 1;
  string type = 2; // fixed | percent
  int64 value = 3;
  int32 count = 4;
  int64 expire_at = 5; // unix 秒，0=不限
}

message CreateCouponBatchReply {
  int32 count = 1;
}

message DisableCouponRequest {
  string batch_id = 1;
}

// DeleteCoupons：ids 非空按 id 删；batch_id 非空删该批次全部未使用。两者只生效其一（ids 优先）。
message DeleteCouponsRequest {
  repeated uint64 ids = 1;
  string batch_id = 2;
}

message DeleteCouponsReply {
  int32 deleted = 1;
}

message ExportCouponsRequest {
  string status = 1; // 空=全部
  string batch_id = 2; // 空=全部批次
}

message ExportCouponsReply {
  string filename = 1;
  string csv = 2; // 含 BOM + 表头，前端直接落盘
}

// ── 扩展：领取/秒杀/促销 ───────────────────────────────

// GrantCoupon 批次赠送指定用户（领取）。
message GrantCouponRequest {
  string batch_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 user_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 count = 3 [(google.api.field_behavior) = REQUIRED];
}

message GrantCouponReply {
  int32 granted = 1;
}

// CreateFlashSale 创建秒杀（限量与卡密同锁）。
message CreateFlashSaleRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 sku_id = 2;
  int64 flash_price = 3 [(google.api.field_behavior) = REQUIRED];
  int64 start_at = 4 [(google.api.field_behavior) = REQUIRED];
  int64 end_at = 5 [(google.api.field_behavior) = REQUIRED];
  int32 limit_qty = 6 [(google.api.field_behavior) = REQUIRED];
  int32 per_user_limit = 7;
}

message FlashSaleItem {
  uint64 id = 1;
  uint64 product_id = 2;
  uint64 sku_id = 3;
  int64 flash_price = 4;
  int64 start_at = 5;
  int64 end_at = 6;
  int32 limit_qty = 7;
  int32 sold_qty = 8;
  int32 per_user_limit = 9;
}

message ListFlashSalesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListFlashSalesReply {
  repeated FlashSaleItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DeleteFlashSaleRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// UpsertPromotion 创建/更新促销。
message UpsertPromotionRequest {
  uint64 id = 1; // 0=创建
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string scope_json = 3; // {"product_ids":[1,2]} / {"category_ids":[3]} / 空=全场
  string type = 4 [(google.api.field_behavior) = REQUIRED]; // fixed | percent | special_price
  int64 threshold = 5; // 满 X（分）
  int64 discount = 6; // fixed=分；percent=万分比
  int64 special_price = 7; // special_price=分
  int64 start_at = 8 [(google.api.field_behavior) = REQUIRED];
  int64 end_at = 9 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 10;
}

message PromotionItem {
  uint64 id = 1;
  string name = 2;
  string scope_json = 3;
  string type = 4;
  int64 threshold = 5;
  int64 discount = 6;
  int64 special_price = 7;
  int64 start_at = 8;
  int64 end_at = 9;
  bool enabled = 10;
}

message ListPromotionsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPromotionsReply {
  repeated PromotionItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
