syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// AdminAuthService 管理后台认证（admin realm JWT，双 realm 防提权串用）。
// 登录 / 登出 / 当前身份（含权限点，供前端动态路由）。
service AdminAuthService {
  // Login 管理员登录。密码 bcrypt 校验；TOTP 校验；captcha_admin_login 开启时图形验证码必填。
  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/login"
      body: "*"
    };
  }
  // GetCaptchaImage 登录图形验证码（免鉴权；captcha_admin_login 开启时登录页使用）。
  rpc GetCaptchaImage(google.protobuf.Empty) returns (CaptchaImageReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/auth/captcha/image"
    };
  }
  // GetCaptchaConfig 登录验证码开关（免鉴权；登录页据此条件渲染验证码区）。
  rpc GetCaptchaConfig(google.protobuf.Empty) returns (CaptchaConfigReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/auth/captcha-config"
    };
  }
  // Logout 登出（JWT 无状态，前端弃用令牌即可；接入 refresh 轮换后落 sessions）。
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/logout"
      body: "*"
    };
  }
  // GetProfile 当前管理员信息与权限点清单（前端动态路由数据源，规划)。
  rpc GetProfile(google.protobuf.Empty) returns (GetProfileReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/auth/profile"
    };
  }
  // RefreshToken 用 refresh token 换新令牌对（一次性轮换）。
  rpc RefreshToken(RefreshTokenRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/refresh"
      body: "*"
    };
  }
  // EnableTOTP 生成 TOTP 密钥（返回 otpauth URL 供二维码）。
  rpc EnableTOTP(google.protobuf.Empty) returns (EnableTOTPReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/totp/enable"
      body: "*"
    };
  }
  // ConfirmTOTP 验证一次确认绑定。
  rpc ConfirmTOTP(ConfirmTOTPRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/totp/confirm"
      body: "*"
    };
  }
  // DisableTOTP 解绑。
  rpc DisableTOTP(ConfirmTOTPRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/totp/disable"
      body: "*"
    };
  }
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  // TOTP 六位动态码（员工开启二步验证时必填）
  string totp_code = 3;
  // 图形验证码 ID/验证码（captcha_admin_login 开启时必填）
  string captcha_id = 4;
  string captcha_code = 5;
}

message CaptchaImageReply {
  string captcha_id = 1; // 验证码 ID（提交时回传）
  string image_base64 = 2; // base64 PNG 图片（data:image/png;base64, 前缀）
}

message CaptchaConfigReply {
  bool enabled = 1; // security.captcha_admin_login 开关
}

message LogoutRequest {
  string refresh_token = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}

message EnableTOTPReply {
  string secret = 1; // base32 密钥（手输用）
  string otpauth_url = 2; // otpauth:// 二维码内容
}

message ConfirmTOTPRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
}

message LoginReply {
  // admin realm 访问令牌（2h）
  string access_token = 1;
  // 令牌类型，固定 Bearer
  string token_type = 2;
  // 过期时间（unix 秒）
  int64 expires_at = 3;
  AdminProfile admin = 4;
  // refresh 令牌（14d，一次性轮换）
  string refresh_token = 5;
}

message GetProfileReply {
  AdminProfile admin = 1;
  // 权限点清单（如 order:list / card:view_content），前端据此生成菜单与按钮
  repeated string permissions = 2;
}

message AdminProfile {
  uint64 id = 1;
  string username = 2;
  string nickname = 3;
  string avatar = 4;
  uint64 role_id = 5;
  string role_name = 6;
  bool totp_enabled = 7;
  google.protobuf.Timestamp last_login_at = 8;
  string last_login_ip = 9;
}
