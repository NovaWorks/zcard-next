syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// AdminAuthService 管理后台认证（admin realm JWT，双 realm 防提权串用）。
// 里程碑 M0：登录 / 登出 / 当前身份（含权限点，供前端动态路由）。
service AdminAuthService {
  // Login 管理员登录。密码 bcrypt 校验；TOTP 校验 M0 后续补齐。
  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/login"
      body: "*"
    };
  }
  // Logout 登出（JWT 无状态，前端弃用令牌即可；M3 接入 refresh 轮换后落 sessions）。
  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/logout"
      body: "*"
    };
  }
  // GetProfile 当前管理员信息与权限点清单（前端动态路由数据源，规划 §9.1）。
  rpc GetProfile(google.protobuf.Empty) returns (GetProfileReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/auth/profile"
    };
  }
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  // TOTP 六位动态码（员工开启二步验证时必填）
  string totp_code = 3;
}

message LoginReply {
  // admin realm 访问令牌（2h）
  string access_token = 1;
  // 令牌类型，固定 Bearer
  string token_type = 2;
  // 过期时间（unix 秒）
  int64 expires_at = 3;
  AdminProfile admin = 4;
}

message GetProfileReply {
  AdminProfile admin = 1;
  // 权限点清单（如 order:list / card:view_content），前端据此生成菜单与按钮
  repeated string permissions = 2;
}

message AdminProfile {
  uint64 id = 1;
  string username = 2;
  string nickname = 3;
  string avatar = 4;
  uint64 role_id = 5;
  string role_name = 6;
  bool totp_enabled = 7;
  google.protobuf.Timestamp last_login_at = 8;
  string last_login_ip = 9;
}
