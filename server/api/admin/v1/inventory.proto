syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminInventoryService 卡密库存管理：导入/导出/列表/操作。
service AdminInventoryService {
  rpc GetTargets(InventoryTargetsRequest) returns (InventoryTargetsReply) {
    option (google.api.http) = { get: "/api/v1/admin/inventory/targets" };
  }
  rpc AssignPreview(AssignPreviewRequest) returns (AssignPreviewReply) {
    option (google.api.http) = { post: "/api/v1/admin/inventory/assign-preview" body: "*" };
  }
  rpc AssignCards(AssignCardsRequest) returns (AssignCardsReply) {
    option (google.api.http) = { post: "/api/v1/admin/inventory/assign" body: "*" };
  }
  rpc PreviewCancelImport(CancelImportRequest) returns (CancelImportPreviewReply) {
    option (google.api.http) = { get: "/api/v1/admin/inventory/imports/{id}/preview" };
  }
  // ImportPreview 上传预览（去重统计 + 样本预览）。
  rpc ImportPreview(ImportPreviewRequest) returns (ImportPreviewReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/inventory/preview"
      body: "*"
    };
  }
  // ImportConfirm 确认导入（分片写入 + 批次追踪）。
  rpc ImportConfirm(ImportConfirmRequest) returns (ImportBatch) {
    option (google.api.http) = {
      post: "/api/v1/admin/inventory/import"
      body: "*"
    };
  }
  // ListImports 导入批次列表。
  rpc ListImports(ListImportsRequest) returns (ListImportsReply) {
    option (google.api.http) = { get: "/api/v1/admin/inventory/imports" };
  }
  // CancelImport 撤销批次（删除本批 available 卡）。
  rpc CancelImport(CancelImportRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/inventory/imports/{id}/cancel"
      body: "*"
    };
  }
  // ListCards 卡密列表（掩码默认；card:view_content 权限才可见完整内容）。
  rpc ListCards(ListCardsRequest) returns (ListCardsReply) {
    option (google.api.http) = { get: "/api/v1/admin/inventory/cards" };
  }
  // ExportCards 导出卡密（card:export 权限 + 审计 + 限流 + CsvSafe）。
  rpc ExportCards(ExportCardsRequest) returns (ExportCardsReply) {
    option (google.api.http) = { post: "/api/v1/admin/inventory/export" body: "*" };
  }
  // ToggleCard 禁用/启用单张卡。
  rpc ToggleCard(ToggleCardRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/inventory/cards/{id}/toggle"
      body: "*"
    };
  }
  // ViewCardContent 查看完整卡密（card:view_content 权限 + 安全审计）。
  rpc ViewCardContent(ViewCardContentRequest) returns (ViewCardContentReply) {
    option (google.api.http) = { get: "/api/v1/admin/inventory/cards/{id}/content" };
  }
  // ListPremiumCards 靓号列表（number_hash 命中 + 可用卡；card:premium 权限）。
  rpc ListPremiumCards(ListPremiumCardsRequest) returns (ListPremiumCardsReply) {
    option (google.api.http) = { get: "/api/v1/admin/inventory/cards/premium" };
  }
}

message ImportPreviewRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string lines = 2 [(google.api.field_behavior) = REQUIRED];
  bool dedup = 3;
  uint64 sku_id = 4; // 有规格商品必须明确选择；无规格商品使用 0。
}

message ImportPreviewReply {
  int32 total = 1;
  int32 dup_in_file = 2;
  int32 dup_in_db = 3;
  int32 invalid = 4;
  repeated string sample = 5;
  bool is_premium = 6;
  uint64 sku_id = 7;
  string sku_name = 8;
  int64 revision = 9;
}

message ImportConfirmRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string lines = 2 [(google.api.field_behavior) = REQUIRED];
  bool dedup = 3;
  uint64 sku_id = 4;
  optional int64 expected_revision = 5;
}

message ImportBatch {
  uint64 id = 1;
  uint64 product_id = 2;
  int32 total = 3;
  int32 imported = 4;
  int32 skipped = 5;
  int32 failed = 6;
  string status = 7;
  optional uint64 sku_id = 8; // 导入时的目标；旧批次缺失表示历史未记录。
  string sku_name = 9; // 导入时名称快照。
  string product_name = 10;
  repeated InventorySkuCount remaining = 11; // 当前卡密分布，不改写导入来源。
}

message ListImportsRequest {
  uint64 product_id = 1;
  optional uint64 sku_id = 2; // 按原导入目标筛选，省略为全部。
  bool legacy_only = 3; // 仅历史未记录目标的批次。
}

message ListImportsReply {
  repeated ImportBatch batches = 1;
}

message CancelImportRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string expected_revision = 2; // 新界面使用预览返回的批次分布指纹。
}

message ListCardsRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2; // available | reserved | used | disabled
  int32 page = 3;
  int32 page_size = 4;
  optional uint64 sku_id = 5; // 省略=全部，0=NULL/0 默认池，正数=指定规格。
  optional uint64 import_id = 6;
}

message ListCardsReply {
  repeated CardInfo cards = 1;
  int64 total = 2;
}

// CardInfo 卡密信息（内容默认掩码 ****尾4位）。
message CardInfo {
  uint64 id = 1;
  uint64 product_id = 2;
  string status = 3;
  string masked_content = 4; // ****abcd
  string note = 5;
  int64 created_at = 6;
  int64 used_at = 7;
  string lottery_draw_no = 8; // 抽奖发放的中奖编号，不改变卡密库存状态
  uint64 sku_id = 9;
  string sku_name = 10;
  uint64 import_id = 11;
}

message ExportCardsRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional uint64 sku_id = 2;
}

message ExportCardsReply {
  repeated string lines = 1; // CsvSafe 处理后的卡密行
}

message ToggleCardRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  bool enable = 2 [(google.api.field_behavior) = REQUIRED];
}

message ViewCardContentRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ViewCardContentReply {
  uint64 id = 1;
  string content = 2; // 完整明文（一次性下发；Cache-Control: no-store 由 transport 保证）
}

message ListPremiumCardsRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional uint64 sku_id = 2;
}

message ListPremiumCardsReply {
  repeated PremiumCardInfo cards = 1;
  int64 total = 2;
}

// PremiumCardInfo 靓号卡（内容掩码；draft_premium 预选加价）。
message PremiumCardInfo {
  uint64 id = 1;
  uint64 product_id = 2;
  string masked_content = 3; // ****尾4位
  int64 draft_premium = 4; // 预选加价（分）
  int64 draft_cost = 5; // 预选成本（分）
  int64 price_cents = 6; // 靓号自选价（0=商品价+premium）
  string status = 7;
  uint64 sku_id = 8;
  string sku_name = 9;
  uint64 import_id = 10;
}

message InventoryTargetsRequest { uint64 product_id = 1; }
message InventoryTarget {
  uint64 sku_id = 1;
  string sku_name = 2;
  bool can_import = 3;
  string reason = 4;
  int64 available = 5;
  int64 reserved = 6;
  int64 disabled = 7;
}
message InventoryTargetsReply {
  uint64 product_id = 1;
  string product_name = 2;
  int64 revision = 3;
  bool has_skus = 4;
  repeated InventoryTarget targets = 5;
}
message InventorySkuCount {
  uint64 sku_id = 1;
  string sku_name = 2;
  int64 available = 3;
  int64 reserved = 4;
  int64 used = 5;
  int64 disabled = 6;
}
message AssignPreviewRequest {
  uint64 product_id = 1;
  uint64 sku_id = 2;
  repeated uint64 card_ids = 3;
  uint64 import_id = 4;
}
message AssignPreviewReply {
  repeated uint64 card_ids = 1;
  int64 eligible_count = 2;
  int64 excluded_count = 3;
  int64 revision = 4;
  string sku_name = 5;
}
message AssignCardsRequest {
  uint64 product_id = 1;
  uint64 sku_id = 2;
  repeated uint64 card_ids = 3;
  optional int64 expected_revision = 4;
  string request_key = 5; // 审计关联标识。
}
message AssignCardsReply { int64 assigned = 1; }
message CancelImportPreviewReply {
  ImportBatch batch = 1;
  string revision = 2;
}
