syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StoreUserService 用户中心（P3-04 前置）：注册/登录（user realm JWT）/我的信息。
// 注册可带邀请码（ref=<user_id>）——三级分销归因链写入（环状拒绝）。
service StoreUserService {
  // Register 注册（username+password；invite_code 可选=上级 user_id）。
  rpc Register(RegisterRequest) returns (RegisterReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/register"
      body: "*"
    };
  }
  // Login 登录（返回 user realm JWT）。
  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/login"
      body: "*"
    };
  }
  // Me 我的信息（需登录）。
  rpc Me(google.protobuf.Empty) returns (MeReply) {
    option (google.api.http) = { get: "/api/v1/storefront/user/me" };
  }
  // ForgotPassword 发送找回密码验证码（P3-10：邮箱不存在同样成功——防枚举）。
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/password/forgot"
      body: "*"
    };
  }
  // ResetPassword 验码重置密码（重置即登录——返回新 token；吊销全部 session）。
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/password/reset"
      body: "*"
    };
  }
  // ChangePassword 登录态改密（旧密码校验；吊销全部 session、响应携带新 token 保当前会话）。
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/password/change"
      body: "*"
    };
  }
  // UpdateProfile 修改资料（邮箱；唯一性校验）。
  rpc UpdateProfile(UpdateProfileRequest) returns (MeReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/profile"
      body: "*"
    };
  }
}

message RegisterRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  string email = 3;
  string invite_code = 4; // 上级 user_id（推广码；可空）
}

message RegisterReply {
  uint64 user_id = 1;
  string token = 2;      // 注册即登录
  int64 expires_at = 3;
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message LoginReply {
  string access_token = 1;
  string token_type = 2;
  int64 expires_at = 3;
}

message MeReply {
  uint64 user_id = 1;
  string username = 2;
  string email = 3;
  int64 created_at = 4;
  bool is_reseller = 5;        // 分站主身份（approved）
  uint64 reseller_profile_id = 6;
}

message ForgotPasswordRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
}

message ForgotPasswordReply {}

message ResetPasswordRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED];        // 邮件验证码
  string new_password = 3 [(google.api.field_behavior) = REQUIRED]; // >= 6 位
}

message ResetPasswordReply {
  string token = 2;      // 重置即登录
  int64 expires_at = 3;
}

message ChangePasswordRequest {
  string old_password = 1 [(google.api.field_behavior) = REQUIRED];
  string new_password = 2 [(google.api.field_behavior) = REQUIRED];
}

message ChangePasswordReply {
  string token = 1;      // 改密后吊销全部 session；新 token 保当前会话
  int64 expires_at = 2;
}

message UpdateProfileRequest {
  string email = 1; // 新邮箱（空=不改；唯一性校验）
}
