syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StorePaymentService 顾客支付。
service StorePaymentService {
  // ListChannels 启用渠道列表（支付页渠道下拉数据源—— 替代前端硬编码枚举）。
  rpc ListChannels(google.protobuf.Empty) returns (ChannelListReply) {
    option (google.api.http) = { get: "/api/v1/storefront/payment/channels" };
  }
  // CreatePayment 创建支付（返回收银台/二维码跳转信息）。
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/payments"
      body: "*"
    };
  }
}

// ChannelListReply 启用渠道列表。
message ChannelListReply {
  repeated ChannelItem channels = 1;
}

message ChannelItem {
  string code = 1;
  string name = 2; // 渠道名称（管理端配置）
  string driver = 3;
  string icon = 4; // 渠道自定义图标 URL（空=前端回落内置徽标）
  repeated MethodItem methods = 5; // 支付方式列表（聚合网关；空=单方式渠道）
}

// MethodItem 支付方式（收银台顾客看到的选项：支付宝/微信/USDT-TRC20…）。
message MethodItem {
  string code = 1;
  string name = 2;
  string icon = 3; // 方式级自定义图标（空=回落渠道图标/内置徽标）
}

message CreatePaymentRequest {
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  string channel = 2 [(google.api.field_behavior) = REQUIRED];
  string method = 3; // 支付方式 code（多方式渠道必选；单方式渠道可空）
}

message CreatePaymentReply {
  uint64 payment_id = 1;
  string type = 2; // redirect | qrcode | params
  string payload = 3; // URL / 二维码内容 / 参数 JSON
}
