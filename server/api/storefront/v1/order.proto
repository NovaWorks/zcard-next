syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StoreOrderService 顾客下单（P1-03 T2）。
service StoreOrderService {
  // CreateOrder 下单（锁卡→算价→快照→事件；Idempotency-Key 头防重）。
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/orders"
      body: "*"
    };
  }
  // GetOrder 凭单号+查询密码查单（三重门之一二：查询密码/登录态本人）。
  rpc GetOrder(GetOrderRequest) returns (GetOrderReply) {
    option (google.api.http) = { get: "/api/v1/storefront/orders/{order_no}" };
  }
  // ListMyOrders 我的订单（登录态；offset 分页）。
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListMyOrdersReply) {
    option (google.api.http) = { get: "/api/v1/storefront/my-orders" };
  }
  // ListGuestOrders 游客按下单联系方式查订单列表（邮箱/手机号；精简信息——
  // 卡密仍需逐单查询密码，防枚举：查不到返回空）。
  rpc ListGuestOrders(ListGuestOrdersRequest) returns (ListGuestOrdersReply) {
    option (google.api.http) = { get: "/api/v1/storefront/guest-orders" };
  }
  // CancelMyOrder 取消本人待支付订单（pending 可取消；锁卡释放+返券）。
  rpc CancelMyOrder(CancelMyOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/storefront/orders/{order_no}/cancel"
      body: "*"
    };
  }
}

message CreateOrderRequest {
  repeated OrderItemInput items = 1 [(google.api.field_behavior) = REQUIRED];
  string guest_contact = 2;
  string query_password = 3;
  string contact = 4;
  string coupon_code = 5;
  // 控件答案（key=控件 ID 字符串，value=答案；多选用逗号分隔）
  map<string, string> control_answers = 6;
  // 积分兑换下单（P3-01：全部商品须为积分商品；积分同事务扣款，订单直落 paid）
  bool use_points = 7;
  // 推广归因码（可空）：游客/无链用户下单时实时解析推广者 → 订单级归因快照
  string ref_code = 8;
  // 图形验证码（captcha_order 开启时游客必填）
  string captcha_id = 9;
  string captcha_code = 10;
}

message OrderItemInput {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 sku_id = 2;
  int32 quantity = 3 [(google.api.field_behavior) = REQUIRED];
}

message CreateOrderReply {
  string order_no = 1;
  int64 total_cents = 2;
  int64 expires_at = 3;
}

message GetOrderRequest {
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  string query_password = 2;
}

message GetOrderReply {
  string order_no = 1;
  string status = 2;
  int64 total_cents = 3;
  repeated OrderItemReply items = 4;
  int64 created_at = 5;
  int64 expires_at = 6; // 订单过期时间（倒计时；0=无过期）
}

message OrderItemReply {
  uint64 product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
}

// ── 游客订单查询（联系方式 + 密码取货闭环）──

message ListGuestOrdersRequest {
  string contact = 1 [(google.api.field_behavior) = REQUIRED]; // 下单时留的邮箱/手机号
}

message ListGuestOrdersReply {
  repeated GuestOrderItem orders = 1;
}

message GuestOrderItem {
  string order_no = 1;
  string status = 2;
  int64 total_cents = 3;
  int64 created_at = 4;
  int64 expires_at = 5;
}

// ── 我的订单（P1-03 补全 2026-08-17）──

message ListMyOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
  // 状态筛选（可选：pending_payment/paid/delivered/completed/canceled/expired/refunded）
  string status = 3;
}

message ListMyOrdersReply {
  repeated MyOrderItem orders = 1;
  int64 total = 2;
}

// MyOrderItem 我的订单行（金额/状态/时间；卡密取回走 GetOrder）。
message MyOrderItem {
  string order_no = 1;
  string status = 2;
  int64 total_cents = 3;
  int64 created_at = 4;
  int64 expired_at = 5;
  int32 item_count = 6;
}

message CancelMyOrderRequest {
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
}
