syntax = "proto3";
package zcard.api.storefront.v1;
option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";
import "google/api/annotations.proto";
service StoreSMSChannelService {
 rpc Options(SMSChannelBrowseRequest) returns(SMSChannelOptionsReply){option(google.api.http)={get:"/api/v1/storefront/products/{product_id}/sms/options"};}
 rpc Offers(SMSChannelBrowseRequest) returns(SMSChannelOffersReply){option(google.api.http)={get:"/api/v1/storefront/products/{product_id}/sms/offers"};}
 rpc Quote(SMSChannelQuoteRequest) returns(SMSChannelQuoteReply){option(google.api.http)={post:"/api/v1/storefront/products/{product_id}/sms/quotes" body:"*"};}
}
message SMSChannelBrowseRequest{uint64 product_id=1;string country_id=2;string platform_id=3;string keyword=4;int32 page=5;int32 page_size=6;}
message SMSChannelOption{string id=1;string name=2;}
message SMSChannelOptionsReply{repeated SMSChannelOption countries=1;repeated SMSChannelOption platforms=2;}
message SMSChannelOffer{string offer_id=1;string name=2;int64 price_cents=3;int32 stock=4;}
message SMSChannelOffersReply{repeated SMSChannelOffer offers=1;bool has_more=2;}
message SMSChannelQuoteRequest{uint64 product_id=1;string offer_id=2;string country_id=3;string platform_id=4;int32 page=5;int32 page_size=6;}
message SMSChannelQuoteReply{string quote_id=1;int64 amount_cents=2;string currency=3;int64 expires_at=4;string offer_name=5;}
