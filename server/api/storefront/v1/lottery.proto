syntax = "proto3";
package zcard.api.storefront.v1;
option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
service StoreLotteryService {
 rpc ListLotteryActivities(google.protobuf.Empty) returns (LotteryActivityList) { option (google.api.http) = {get:"/api/v1/storefront/lottery/activities"}; }
 rpc GetLotteryActivity(LotteryIDRequest) returns (LotteryActivity) { option (google.api.http) = {get:"/api/v1/storefront/lottery/activities/{id}"}; }
 rpc ClaimLotteryChances(LotteryIDRequest) returns (LotteryChances) { option (google.api.http) = {post:"/api/v1/storefront/lottery/activities/{id}/chances" body:"*"}; }
 rpc DrawLottery(LotteryDrawRequest) returns (LotteryDraw) { option (google.api.http) = {post:"/api/v1/storefront/lottery/activities/{id}/draw" body:"*"}; }
 rpc ListMyLotteryDraws(LotteryListRequest) returns (LotteryDrawList) { option (google.api.http) = {get:"/api/v1/storefront/lottery/draws"}; }
 rpc GetMyLotteryDraw(LotteryResultRequest) returns (LotteryDraw) { option (google.api.http) = {get:"/api/v1/storefront/lottery/draws/{draw_no}"}; }
}
message LotteryIDRequest {uint64 id=1;}
message LotteryListRequest {int32 page=1;int32 page_size=2;}
message LotteryDrawRequest {uint64 id=1;string request_key=2;}
message LotteryResultRequest {string draw_no=1;}
message LotteryPrize {uint64 id=1;string name=2;string image=3;string mode=4;int32 probability=5;int32 remaining=6;}
message LotteryActivity {uint64 id=1;string name=2;string description=3;string image=4;string status=5;int64 start_at=6;int64 end_at=7;string timezone=8;string chance_mode=9;int32 chance_count=10;repeated LotteryPrize prizes=11;int32 revision=12;}
message LotteryActivityList {repeated LotteryActivity items=1;}
message LotteryChances {int32 remaining=1;string period=2;}
message LotteryDraw {string draw_no=1;string activity_name=2;string prize_name=3;string mode=4;string status=5;int64 created_at=6;int64 delivered_at=7;string content=8;uint64 activity_id=9;}
message LotteryDrawList {repeated LotteryDraw items=1;int64 total=2;}
